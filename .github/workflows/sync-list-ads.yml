name: Sync Ads Lists
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Download Hagezi
        run: |
          ... (твой код)

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ads/ data/category-ads
          git commit -m "chore: update ads ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Trigger category generator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: generate-categories

name: Sync Ads Lists
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Download and clean Ads lists
        run: |
          mkdir -p data/ads

          # Ads sources
          declare -a ADS=(
          # "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/domains/light.txt|hagezi"
            "https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/refs/heads/master/CyrillicFilters/RussianFilter/sections/adservers_firstparty.txt|adguard"
          )

          for entry in "${ADS[@]}"; do
            URL="${entry%%|*}"
            NAME="${entry##*|}"
            RAW_FILE="data/ads/${NAME}_raw"
            OUT_FILE="data/ads/${NAME}"

            echo "📥 Downloading ${NAME}..."
            if curl -sSL --fail -o "${RAW_FILE}" "${URL}"; then
              echo "✅ ${NAME} downloaded"
            else
              echo "❌ Failed to download ${NAME}"
              continue
            fi

            echo "🧹 Cleaning ${NAME}..."
            awk '
              /^[!]/ {next}                # skip comments
              /^$/ {next}                  # skip empty lines
              {
                line=$0
                sub(/^\|\|/, "", line)     # remove leading ||
                sub(/\^.*$/, "", line)     # cut at ^
                sub(/\$.*$/, "", line)     # cut at $
                gsub("\\*", "", line)      # remove wildcards
                if (line != "") print line
              }
            ' "${RAW_FILE}" | sort -u > "${OUT_FILE}"

            rm -f "${RAW_FILE}"

            lines=$(wc -l < "${OUT_FILE}")
            echo "✅ Cleaned ${NAME}: ${lines} доменов"
          done

          echo "📁 Файлы в data/ads/: "
          ls -1 data/ads/

      - name: Update category-ads
        run: |
          if [ -f data/category-ads ]; then
            sed -i 's|include:ads/adguard|include:ads/hagezi|g' data/category-ads
            sed -i 's|include:adguard|include:hagezi|g' data/category-ads
            for src in hagezi adguard; do
              if ! grep -q "include:ads/${src}" data/category-ads; then
                echo "include:ads/${src}" >> data/category-ads
              fi
            done
            echo "✅ Обновлён data/category-ads"
            cat data/category-ads
          else
            echo "⚠️ data/category-ads не найден, создаём... "
            {
              # echo "include:ads/hagezi"
              echo "include:ads/adguard"
            } > data/category-ads
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ads/ data/category-ads
          git commit -m "chore: update ads ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Trigger category generator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: generate-categories

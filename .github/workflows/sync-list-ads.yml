name: Sync Ads Lists
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Download and clean Ads lists
        run: |
          mkdir -p data/ads

          # Ads sources
          # hagezi: jsDelivr отдаёт 403 — репозиторий вырос больше лимита 150 МБ
          # («Package size exceeded the configured limit»), а каталог domains/
          # переименован в wildcard/. Берём напрямую из raw.githubusercontent:
          # light-onlydomains.txt — чистые домены, ровно один на строку.
          declare -a ADS=(
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/light-onlydomains.txt|hagezi"
            "https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/refs/heads/master/CyrillicFilters/RussianFilter/sections/adservers_firstparty.txt|adguard"
          )

          # Неудача скачивания не должна проходить незамеченной: 31.07.2026 hagezi
          # перестал скачиваться, workflow ещё три месяца рапортовал success, и
          # рекламный список молча старел (к ноябрю расхождение достигло 60%)
          FAILED=()
          for entry in "${ADS[@]}"; do
            URL="${entry%%|*}"
            NAME="${entry##*|}"
            RAW_FILE="data/ads/${NAME}_raw"
            OUT_FILE="data/ads/${NAME}"

            echo "📥 Downloading ${NAME}..."
            if curl -sSL --fail --retry 3 --retry-delay 5 -o "${RAW_FILE}" "${URL}"; then
              echo "✅ ${NAME} downloaded"
            else
              echo "::error::Не удалось скачать ${NAME} из ${URL} — файл data/ads/${NAME} остался прежним"
              FAILED+=("${NAME}")
              continue
            fi

            echo "🧹 Cleaning ${NAME}..."
            awk '
              /^[!]/ {next}                # skip comments
              /^$/ {next}                  # skip empty lines
              /\/+/ {next}                 # skip URLs with paths
              {
                line=$0

                # remove adblock syntax
                sub(/^\|\|/, "", line)
                sub(/\^.*$/, "", line)
                sub(/\$.*$/, "", line)
                gsub("\\*", "", line)

                if (line != "") print line
              }
            ' "${RAW_FILE}" | sort -u > "${OUT_FILE}"

            rm -f "${RAW_FILE}"

            lines=$(wc -l < "${OUT_FILE}")
            echo "✅ Cleaned ${NAME}: ${lines} domains"
          done

          echo "📁 Files in data/ads/:"
          ls -1 data/ads/

          if [ "${#FAILED[@]}" -gt 0 ]; then
            {
              echo "### ⚠️ Списки не обновились"
              echo ""
              for name in "${FAILED[@]}"; do
                echo "- \`${name}\` — скачивание не удалось, в сборке остался прошлый файл"
              done
              echo ""
              echo "Проверьте URL источника: он мог переехать или упереться в лимит CDN."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Update category-ads
        run: |
          if [ -f data/category-ads ]; then
            sed -i 's|include:ads/adguard|include:ads/hagezi|g' data/category-ads
            sed -i 's|include:adguard|include:hagezi|g' data/category-ads
            for src in hagezi adguard; do
              if ! grep -q "include:ads/${src}" data/category-ads; then
                echo "include:ads/${src}" >> data/category-ads
              fi
            done
            echo "✅ Updated data/category-ads"
            cat data/category-ads
          else
            echo "⚠️ data/category-ads not found, creating..."
            {
              echo "include:ads/hagezi"
              echo "include:ads/adguard"
            } > data/category-ads
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ads/ data/category-ads
          git commit -m "chore: update ads ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Trigger category generator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: generate-categories

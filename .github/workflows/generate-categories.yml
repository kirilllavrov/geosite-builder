name: Generate Categories

on:
  workflow_dispatch:
  repository_dispatch:
    types: [generate-categories]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Generate category-* files
        run: |
          echo "🔧 Universal Category Generator"

          # === Generate categories for all directories except private.d ===
          for dir in data/*; do
            [ -d "$dir" ] || continue
            category=$(basename "$dir")

            # Пропускаем private.d — он обрабатывается отдельно
            if [[ "$category" == "private.d" ]]; then
              echo "⚠️ Skipping private.d (special case)"
              continue
            fi

            # Пропускаем директорию private (если вдруг появится)
            if [[ "$category" == "private" ]]; then
              echo "⚠️ Skipping private (special case)"
              continue
            fi

            category_file="data/category-$category"

            {
              echo "# Auto-generated category: $category"
              echo "# Generated: $(date -Iseconds)"
              echo ""
              for file in "$dir"/*; do
                [ -f "$file" ] || continue
                fname=$(basename "$file")
                echo "include:$fname"
              done
            } > "$category_file"

            echo "✅ Generated $category_file"
          done

          # === Special case: private ===
          if [ -f data/private.d/private ]; then
            {
              echo "# Auto-generated private category"
              echo "# Generated: $(date -Iseconds)"
              echo ""
              echo "include:private"
            } > data/private

            echo "✅ Generated data/private (category private)"
          else
            echo "⚠️ No private list found in data/private.d/, skipping category private"
          fi

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/category-* data/private
          git commit -m "chore: auto-generate categories ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

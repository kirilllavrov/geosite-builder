name: Generate Categories

on:
  workflow_dispatch:
  repository_dispatch:
    types: [generate-categories]
  schedule:
    - cron: "15 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Generate category-* files
        run: |
          echo "🔧 Universal Category Generator"

          for dir in data/*; do
            [ -d "$dir" ] || continue
            category=$(basename "$dir")

            # Особый случай
            if [[ "$category" == "private" ]]; then
              echo "⚠️ Skipping private"
              continue
            fi

            category_file="data/category-$category"

            {
              echo "# Auto-generated category: $category"
              echo "# Generated: $(date -Iseconds)"
              echo ""
              for file in "$dir"/*; do
                [ -f "$file" ] || continue
                fname=$(basename "$file")
                echo "include:$fname"
              done
            } > "$category_file"

            echo "✅ Generated $category_file"
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/category-*
          git commit -m "chore: auto-generate categories ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

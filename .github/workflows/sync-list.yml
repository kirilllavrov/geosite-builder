name: Sync Lists
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Download mobile, streaming, browser, private lists
        run: |
          mkdir -p data/mobile data/streaming data/browser data/private
          ... (твой код скачивания без изменений)

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/mobile/ data/streaming/ data/browser/ data/private/
          git commit -m "chore: update lists ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Trigger category generator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: generate-categories

---
name: Sync RU Lists
on:
  schedule:
    - cron: "0 0 * * *" # yamllint disable-line rule:truthy
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          path: geosite-builder

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: kirilllavrov/whitelists
          token: ${{ secrets.GH_PAT }}
          path: source-repo
          fetch-depth: 0

      - name: Sync and process RU domains
        run: |
          cd geosite-builder
          mkdir -p data/ru

          # Копируем файлы из нового пути в исходном репозитории
          rm -rf data/ru/*
          cp -r ../source-repo/src/domains/* data/ru/

          # Удаляем служебные файлы
          rm -f data/ru/category-ru data/ru/whitelist-ru

          # Раскомментируем домены + конвертация IDN в punycode
          cat > /tmp/process_domains.py << 'PYEOF'
          import sys, re
          try:
              import idna
          except ImportError:
              print("❌ idna library not installed", file=sys.stderr)
              sys.exit(1)

          def to_punycode(domain):
              try:
                  return idna.encode(domain, uts46=True).decode('ascii').lower()
              except:
                  return None

          def is_valid_ascii_domain(d):
              return bool(re.match(
                  r'^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$', d))

          for filepath in sys.argv[1:]:
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      lines = f.readlines()
                  result = []
                  for line in lines:
                      line = line.strip()
                      if not line or line.startswith('#'):
                          continue
                      if line.startswith('#'):
                          line = line[1:].strip()
                      if any(ord(c) > 127 for c in line):
                          converted = to_punycode(line)
                          if converted and is_valid_ascii_domain(converted):
                              result.append(converted)
                      elif is_valid_ascii_domain(line.lower()):
                          result.append(line.lower())
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(result) + '\n' if result else '')
                  print(f"✅ {filepath}: {len(result)} доменов")
              except Exception as e:
                  print(f"❌ {filepath}: {e}", file=sys.stderr)
          PYEOF

          python3 /tmp/process_domains.py data/ru/*

          # Генерируем category-ru в корне data/ с include:filename (без пути)
          # Исключаем: category-ru, whitelist-ru, private
          {
            echo "# Auto-generated RU category list"
            echo "# Generated: $(date -Iseconds)"
            echo ""
            for file in data/ru/*; do
              [ -f "$file" ] || continue
              fname=$(basename "$file")
              # Пропускаем служебные файлы и private
              case "$fname" in
                category-ru|whitelist-ru|private) continue ;;
              esac
              echo "include:$fname"
            done
          } > data/category-ru

          echo "📊 Файлов в data/ru/: $(ls -1 data/ru/ 2>/dev/null | wc -l)"

      - name: Commit and push
        run: |
          cd geosite-builder
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git status
          git add data/ru/ data/category-ru

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync RU domains ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "✅ Изменений нет, пуш не требуется"
          fi

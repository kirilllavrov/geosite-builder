name: Sync RU Lists
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: geosite-builder

      - uses: actions/checkout@v6
        with:
          repository: kirilllavrov/whitelists
          token: ${{ secrets.GH_PAT }}
          path: source-repo

      - name: Sync RU
        run: |
          cd geosite-builder
          ... (твой код без изменений)

      - name: Commit and push
        run: |
          cd geosite-builder
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ru/ data/category-ru
          git commit -m "chore: sync RU ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

      - name: Trigger category generator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: generate-categories

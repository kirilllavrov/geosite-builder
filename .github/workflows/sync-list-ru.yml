name: Sync RU Lists
on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          path: geosite-builder
          ref: main

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: kirilllavrov/whitelists
          token: ${{ secrets.GH_PAT }}
          path: source-repo
          fetch-depth: 0

      - name: Sync and process RU domains
        run: |
          cd geosite-builder
          mkdir -p data/ru

          # Очистка целевой директории
          rm -rf data/ru/*

          # Копирование и переименование: category-*.ru → *.ru
          for src_file in ../source-repo/src/domains/*; do
              [ -f "$src_file" ] || continue
              fname=$(basename "$src_file")

              # Пропускаем category-ru
              [[ "$fname" == "category-ru" ]] && continue

              new_name="${fname#category-}"
              cp "$src_file" "data/ru/$new_name"
              echo "📄 $fname → $new_name"
          done

          # Скрипт обработки доменов
          cat > /tmp/process_domains.py << 'PYEOF'
          import sys, re
          try:
              import idna
          except ImportError:
              print("❌ idna library not installed", file=sys.stderr)
              sys.exit(1)

          def to_punycode(domain):
              try:
                  return idna.encode(domain, uts46=True).decode('ascii').lower()
              except Exception:
                  return None

          # Разрешаем многоуровневые домены
          ascii_re = re.compile(r'^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')

          def is_valid_ascii_domain(d):
              return ascii_re.match(d) and '.' in d

          for filepath in sys.argv[1:]:
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      lines = f.readlines()

                  result = []
                  for line in lines:
                      line = line.strip()
                      if not line:
                          continue
                      if line.startswith('#'):
                          line = line[1:].strip()
                          if not line:
                              continue

                      # IDN → punycode
                      if any(ord(c) > 127 for c in line):
                          converted = to_punycode(line)
                          if converted and is_valid_ascii_domain(converted):
                              result.append(converted)
                      else:
                          d = line.lower()
                          if is_valid_ascii_domain(d):
                              result.append(d)

                  # Убираем дубликаты + сортировка
                  result = sorted(set(result))

                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(result) + '\n' if result else '')

                  print(f"✅ {filepath}: {len(result)} доменов")

              except Exception as e:
                  print(f"❌ {filepath}: {e}", file=sys.stderr)
          PYEOF

          python3 /tmp/process_domains.py data/ru/*

          # Генерируем category-ru
          {
            echo "# Auto-generated RU category list"
            echo "# Generated: $(date -Iseconds)"
            echo ""
            for file in data/ru/*; do
              [ -f "$file" ] || continue
              fname=$(basename "$file")
              case "$fname" in
                category-ru|whitelist-ru|private) continue ;;
              esac
              echo "include:$fname"
            done
          } > data/category-ru

          echo "📊 Файлов в data/ru/: $(ls -1 data/ru/ 2>/dev/null | wc -l)"
          echo "📋 Содержимое category-ru:"
          cat data/category-ru

      - name: Commit and push
        run: |
          cd geosite-builder
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git status
          git add data/ru/ data/category-ru

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync RU domains ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "✅ Изменений нет, пуш не требуется"
          fi

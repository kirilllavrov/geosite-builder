---
name: Build Geosite
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Clone v2fly builder
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git builder

      - name: Flatten data for builder (AUTO-DETECT DIRECTORIES)
        run: |
          rm -rf builder/data
          mkdir -p builder/data

          echo "🔍 Detecting data directories..."
          DATA_DIRS=()

          for dir in data/*; do
            [ -d "$dir" ] || continue
            base=$(basename "$dir")

            case "$base" in
              private) continue ;;
              category-*) continue ;;
            esac

            DATA_DIRS+=("$dir")
          done

          echo "📁 Found directories:"
          printf ' - %s\n' "${DATA_DIRS[@]}"

          > /tmp/valid_lists.txt

          for dir in "${DATA_DIRS[@]}"; do
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              fname=$(basename "$file")

              [[ "$fname" == category-* ]] && continue

              if grep -qE '^[a-zA-Z0-9]' "$file" 2>/dev/null; then
                cp "$file" "builder/data/$fname"
                echo "$fname" >> /tmp/valid_lists.txt
              else
                echo "⚠️ Пропущен (пустой): $fname"
              fi
            done
          done

          echo "📄 Valid lists:"
          cat /tmp/valid_lists.txt

          echo "🔧 Processing category-* files..."
          for cat in data/category-*; do
            [ -f "$cat" ] || continue
            cname=$(basename "$cat")

            {
              grep '^#' "$cat" 2>/dev/null || true
              echo ""
              grep '^include:' "$cat" | while read -r line; do
                inc_name=$(echo "$line" | sed 's|include:.*/||; s|include:||')
                if grep -qx "$inc_name" /tmp/valid_lists.txt; then
                  echo "$line" | sed 's|include:[^/]*/|include:|'
                else
                  echo "⚠️ Исключён из $cname: $inc_name"
                fi
              done
            } > "builder/data/$cname"

            echo "✅ Processed: $cname"
          done

          echo "📁 Total files in builder/data:"
          ls -1 builder/data | wc -l

      - name: Generate geosite.dat
        run: |
          cd builder
          if ! go run ./ --datapath=./data --outputdir=./output; then
            echo "❌ Ошибка сборки"
            exit 1
          fi
          mv ./output/dlc.dat ./output/geosite.dat
          echo "📊 Размер: $(ls -lh ./output/geosite.dat | awk '{print $5}')"

      - name: Convert for Mihomo/Sing-box
        run: |
          cd builder
          go install github.com/metacubex/geo/cmd/geo@latest
          geo convert site -i v2ray -o sing -f output/geosite.db ./output/geosite.dat
          mkdir -p ../output
          cp ./output/geosite.dat ../output/
          cp ./output/geosite.db ../output/
          echo "📊 geosite.dat: $(ls -lh ../output/geosite.dat | awk '{print $5}')"
          echo "📊 geosite.db: $(ls -lh ../output/geosite.db | awk '{print $5}')"

      - name: Prepare temp release files
        run: |
          mkdir -p /tmp/geosite-release
          cp output/geosite.dat /tmp/geosite-release/geosite.dat
          cp output/geosite.db /tmp/geosite-release/geosite.db
          sha256sum /tmp/geosite-release/geosite.dat | awk '{print $1}' > /tmp/geosite-release/geosite.dat.sha256sum

      - name: Publish to release branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin

          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
          elif git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -b release origin/release
          else
            git checkout --orphan release
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp /tmp/geosite-release/geosite.dat ./geosite.dat
          cp /tmp/geosite-release/geosite.db ./geosite.db
          cp /tmp/geosite-release/geosite.dat.sha256sum ./geosite.dat.sha256sum

          git add geosite.dat geosite.db geosite.dat.sha256sum

          if ! git diff --staged --quiet; then
            git commit -m "build: update geosite files ($(date +%Y-%m-%d))"
            git push origin HEAD:release --force
          else
            echo "✅ Файлы без изменений"
          fi

      - name: Restore files for GitHub Release
        run: |
          mkdir -p output
          cp /tmp/geosite-release/geosite.dat output/geosite.dat
          cp /tmp/geosite-release/geosite.db output/geosite.db
          cp /tmp/geosite-release/geosite.dat.sha256sum output/geosite.dat.sha256sum

      - name: Read SHA256
        id: sha256
        run: echo "SHA256=$(cat output/geosite.dat.sha256sum)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Geosite build #${{ github.run_number }}
          body: |
            Автоматическая сборка geosite для Mihomo/Sing-box

            🔄 Run: #${{ github.run_number }}
            🔗 Commit: ${{ github.sha }}

            📦 Форматы:
            - geosite.dat (V2Ray/Xray)
            - geosite.db (Sing-box/Mihomo)

            🌐 jsDelivr CDN:
            ```
            https://cdn.jsdelivr.net/gh/kirilllavrov/geosite-builder@release/geosite.dat
            https://cdn.jsdelivr.net/gh/kirilllavrov/geosite-builder@release/geosite.db
            https://cdn.jsdelivr.net/gh/kirilllavrov/geosite-builder@release/geosite.dat.sha256sum
            ```
            🔑 SHA256:
            ```
            ${{ env.SHA256 }}
            ```
          files: |
            output/geosite.dat
            output/geosite.db
            output/geosite.dat.sha256sum
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Return to main branch
        run: |
          git checkout main

      - name: Commit source changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "chore: sync source data ($(date +%Y-%m-%d))" || true
          git push origin HEAD:${{ github.ref_name }} || true

---
name: Build Geosite
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Clone v2fly builder
        run: |
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git builder

      - name: Flatten data for builder
        run: |
          rm -rf builder/data
          mkdir -p builder/data

          > /tmp/valid_lists.txt
          for dir in data/ru data/ads data/mobile data/streaming data/browser data/cdn; do
            [ -d "$dir" ] || continue
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              fname=$(basename "$file")
              [[ "$fname" == category-* ]] && continue

              if grep -qE '^[a-zA-Z0-9]' "$file" 2>/dev/null; then
                cp "$file" "builder/data/$fname"
                echo "$fname" >> /tmp/valid_lists.txt
              else
                echo "⚠️ Пропущен (пустой): $fname" >&2
              fi
            done
          done

          for cat in data/category-*; do
            [ -f "$cat" ] || continue
            cname=$(basename "$cat")

            {
              grep '^#' "$cat" 2>/dev/null || true
              echo ""
              grep '^include:' "$cat" 2>/dev/null | while read -r line; do
                inc_name=$(echo "$line" | sed 's|include:.*/||; s|include:||')
                if grep -qx "$inc_name" /tmp/valid_lists.txt 2>/dev/null; then
                  echo "$line" | sed 's|include:[^/]*/|include:|'
                else
                  echo "⚠️ Исключён из $cname: $inc_name" >&2
                fi
              done
            } > "builder/data/$cname"

            echo "✅ Обработан: $cname" >&2
          done

          echo "📁 Файлов: $(ls -1 builder/data/ | wc -l)" >&2

      - name: Generate geosite.dat
        run: |
          cd builder
          if ! go run ./ --datapath=./data --outputdir=./output; then
            echo "❌ Ошибка сборки"
            exit 1
          fi
          mv ./output/dlc.dat ./output/geosite.dat
          echo "📊 Размер: $(ls -lh ./output/geosite.dat | awk '{print $5}')"

      - name: Convert for Mihomo/Sing-box
        run: |
          cd builder
          go install github.com/metacubex/geo/cmd/geo@latest
          geo convert site -i v2ray -o sing -f output/geosite.db ./output/geosite.dat
          mkdir -p ../output
          cp ./output/geosite.dat ../output/
          cp ./output/geosite.db ../output/
          echo "📊 geosite.dat: $(ls -lh ../output/geosite.dat | awk '{print $5}')" >&2
          echo "📊 geosite.db: $(ls -lh ../output/geosite.db | awk '{print $5}')" >&2

      - name: Publish to release branch
        run: |
          # Сохраняем артефакты
          mkdir -p /tmp/geosite-release
          cp output/geosite.dat /tmp/geosite-release/geosite.dat
          cp output/geosite.db /tmp/geosite-release/geosite.db

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin

          # Создаём или переключаемся на release
          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
          elif git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -b release origin/release
          else
            git checkout --orphan release
          fi

          # Полностью очищаем ветку release
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          # Кладём только геофайлы
          cp /tmp/geosite-release/geosite.dat ./geosite.dat
          cp /tmp/geosite-release/geosite.db ./geosite.db

          git add geosite.dat geosite.db

          if ! git diff --staged --quiet; then
            git commit -m "build: update geosite files ($(date +%Y-%m-%d))"
            git push origin HEAD:release --force
            echo "✅ Опубликовано в ветку release" >&2
          else
            echo "✅ Файлы без изменений" >&2
          fi
      - name: Restore files for GitHub Release
        run: |
          mkdir -p output
          cp /tmp/geosite-release/geosite.dat output/geosite.dat
          cp /tmp/geosite-release/geosite.db output/geosite.db
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Geosite build #${{ github.run_number }}
          body: |
            Автоматическая сборка geosite для Mihomo/Sing-box

            🔄 Run: #${{ github.run_number }}
            🔗 Commit: ${{ github.sha }}
            📦 Форматы:
            - geosite.dat (V2Ray/Xray)
            - geosite.db (Sing-box/Mihomo)

            🌐 jsDelivr CDN:
            ```
            https://cdn.jsdelivr.net/gh/kirilllavrov/geosite-builder@release/geosite.dat
            https://cdn.jsdelivr.net/gh/kirilllavrov/geosite-builder@release/geosite.db
            ```
          files: |
            output/geosite.dat
            output/geosite.db
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit source changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git status
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync source data ($(date +%Y-%m-%d))"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "✅ Исходники без изменений"
          fi
